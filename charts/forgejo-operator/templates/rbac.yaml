apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "forgejo-operator.name" . }}
rules:
  - apiGroups: ["forgejo.jakeschurch.com"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["forgejo.jakeschurch.com"]
    resources: ["*/status", "*/finalizers"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "forgejo-operator.name" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "forgejo-operator.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "forgejo-operator.name" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "forgejo-operator.name" . }}-leader-election
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "forgejo-operator.name" . }}-leader-election
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "forgejo-operator.name" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "forgejo-operator.name" . }}
    namespace: {{ .Release.Namespace }}
---
# 2026-11-11: minting provenance is writable only in the operator namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "forgejo-operator.name" . }}-gpg-state
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "forgejo-operator.name" . }}-gpg-state
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "forgejo-operator.name" . }}-gpg-state
subjects:
  - kind: ServiceAccount
    name: {{ include "forgejo-operator.name" . }}
    namespace: {{ .Release.Namespace }}
