apiVersion: v1
kind: Service
metadata:
  name: {{ include "forgejo-operator.name" . }}
  labels: {{- include "forgejo-operator.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "forgejo-operator.name" . }}
  ports:
    - { name: metrics, port: {{ .Values.metrics.port }}, targetPort: metrics }
