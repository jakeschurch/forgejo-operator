replicaCount: 1
image:
  repository: harbor.oci-registry.svc.cluster.local/foundry/forgejo-operator
  tag: latest
  pullPolicy: IfNotPresent
imagePullSecrets: []
resources:
  requests: { cpu: 25m, memory: 64Mi }
  limits: { memory: 256Mi }
serviceMonitor:
  enabled: false
networkPolicy:
  enabled: true
  forgejoNamespace: forgejo
  forgejoPort: 3000
  apiServerCIDR: 10.43.0.1/32
  apiServerPort: 443
  # Some CNIs enforce policy both before and after Kubernetes Service DNAT.
  apiServerEndpointCIDR: ""
  apiServerEndpointPort: 6443
  ciliumApiServerEntity:
    enabled: false
    port: 6443
metrics:
  secure: true
  port: 8443
