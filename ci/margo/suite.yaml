# Path selection uses OR; every filtered check includes its own CI definitions.
# # go:test stays unconditional as the repository regression backstop: Go discovers
# packages across the repository. Unknown paths must not produce an empty green plan.
# Native checks qualified before queue activation; every selected check blocks landing.
#
# Homelab renders this file (vmetal/ci/margo-checks/sourced/forgejo-operator).
# nix:build builds the flake attribute of the operator image (packages.image),
# the same package the main-branch oci-image-build pushes, so the queue probe
# and the main build share one derivation. The image skips the in-build tests;
# go:test builds packages.testReport separately so failing cases stay ingestible.
apiVersion: ci.foundrybox.dev/v1alpha1
kind: CheckSuite
metadata:
  name: forgejo-operator-checks
  namespace: argo
spec:
  repositoryRef:
    name: forgejo-operator
    namespace: forgejo
  context: margo/forgejo-operator-checks
  checkout:
    url: ssh://git@forgejo-ssh.forgejo.svc.cluster.local:22/jake/forgejo-operator.git
    deployKeySecret: forgejo-operator-margo-readonly
  checks:
    # go vet and go test run inside packages.testReport on the farm; the check
    # ingests its go.json and fails on its exit-code, so vet needs no separate
    # check and an unchanged Go source tree is a cache hit.
    - name: go:test
      template: nix-go-test
      kind: test
      params:
        attr: .#testReport
    - name: generate:drift
      paths:
        - "**/.gitignore"
        - api/**
        - config/crd/**
        - charts/forgejo-operator/crds/**
        - vendor/**
        - Makefile
        - GNUmakefile
        - makefile
        - go.mod
        - go.sum
        - flake.nix
        - flake.lock
        - "**/*.nix"
        - ci/margo/**
        - "**/.gitattributes"
        - .tool-versions
        - .mise.toml
        - mise.toml
        - go.work
        - go.work.sum
      template: generate-drift
      params:
        command: >-
          CGO_ENABLED=0 go install sigs.k8s.io/controller-tools/cmd/controller-gen@v0.16.5 &&
          make generate
    - name: helm:chart
      paths:
        - charts/forgejo-operator/**
        - Makefile
        - GNUmakefile
        - makefile
        - flake.nix
        - flake.lock
        - "**/*.nix"
        - ci/margo/**
        - "**/.gitattributes"
        - .tool-versions
        - .mise.toml
        - mise.toml
        - go.mod
        - go.sum
        - go.work
        - go.work.sum
      template: helm-lint
      params:
        chart: charts/forgejo-operator
    - name: nix:build
      paths:
        - "**/*.go"
        - Makefile
        - GNUmakefile
        - makefile
        - go.mod
        - go.sum
        - flake.nix
        - flake.lock
        - "**/*.nix"
        - ci/margo/**
        - "**/.gitattributes"
        - .tool-versions
        - .mise.toml
        - mise.toml
        - go.work
        - go.work.sum
      template: nix-build
      required: true
      params:
        attr: .#image
