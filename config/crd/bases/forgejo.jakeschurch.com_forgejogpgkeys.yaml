                && (!has(self.providerNamespace) || self.providerNamespace == oldSelf.providerNamespace)
            - message: algorithm is immutable
              rule: '(has(self.algorithm) ? self.algorithm : ''ed25519'') == (has(oldSelf.algorithm)
                ? oldSelf.algorithm : ''ed25519'')'
          status:
