---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: forgejosshkeys.forgejo.jakeschurch.com
spec:
  group: forgejo.jakeschurch.com
  names:
    kind: ForgejoSSHKey
    listKind: ForgejoSSHKeyList
    plural: forgejosshkeys
    singular: forgejosshkey
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.user
      name: User
      type: string
    - jsonPath: .status.fingerprint
      name: Fingerprint
      type: string
    - jsonPath: .status.verified
      name: Verified
      type: boolean
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              SSHKeySpec declares an existing user's SSH public key, typically the key the
              user signs commits with (git config gpg.format=ssh). The operator never holds
              the private key: it registers the public half and reports whether the owner
              has proven possession, which Forgejo requires before it trusts signatures.
              Forgejo has no signing-only key type: a registered key also authenticates
              git-over-SSH as the user.
            properties:
              deletionPolicy:
                default: Orphan
                description: Orphan leaves the key (and its verification) on the account
                  on deletion.
                enum:
                - Orphan
                - Delete
                type: string
              providerNamespace:
                type: string
              providerRef:
                minLength: 1
                type: string
              publicKey:
                description: 'PublicKey is one authorized_keys line: "<type> <base64>
                  [comment]".'
                minLength: 1
                type: string
              title:
                description: |-
                  Title is used only when the operator creates the key. A key already on the
                  account (matched by fingerprint) is adopted with its existing title:
                  Forgejo cannot rename keys, and recreating one discards its verification.
                maxLength: 50
                minLength: 1
                type: string
              user:
                minLength: 1
                type: string
            required:
            - providerRef
            - publicKey
            - title
            - user
            type: object
            x-kubernetes-validations:
            - message: providerRef, user and publicKey are immutable
              rule: self.providerRef == oldSelf.providerRef && self.user == oldSelf.user
                && self.publicKey == oldSelf.publicKey
            - message: providerNamespace is immutable
              rule: has(self.providerNamespace) == has(oldSelf.providerNamespace)
                && (!has(self.providerNamespace) || self.providerNamespace == oldSelf.providerNamespace)
          status:
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              fingerprint:
                description: Fingerprint is the SHA256 fingerprint Forgejo matches
                  signatures against.
                type: string
              generatedSecrets:
                items:
                  description: |-
                    LocalObjectReference contains enough information to let you locate the
                    referenced object inside the same namespace.
                  properties:
                    name:
                      default: ""
                      description: |-
                        Name of the referent.
                        This field is effectively required, but due to backwards compatibility is
                        allowed to be empty. Instances of this type with an empty value here are
                        almost certainly wrong.
                        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                      type: string
                  type: object
                  x-kubernetes-map-type: atomic
                type: array
              lastReconciliationTime:
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
              remoteID:
                type: string
              verificationURL:
                description: VerificationURL is the settings page where the owner
                  proves possession.
                type: string
              verified:
                description: |-
                  Verified mirrors Forgejo: true once the owner proved possession of the
                  private key. Only verified keys mark signed commits as Verified. Unset
                  while unregistered, or when Forgejo (before 17) does not report it.
                type: boolean
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
